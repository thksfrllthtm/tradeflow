name: import-calculator

services:
  db:
    # Postgres 17 с расширением pgvector (миграция 000042: векторы описаний фото).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      BACKEND_PORT: 8080
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      CERAMICS_AI_API_KEY: ${CERAMICS_AI_API_KEY:-}
      CERAMICS_AI_BASE_URL: ${CERAMICS_AI_BASE_URL:-}
      CERAMICS_AI_MODEL: ${CERAMICS_AI_MODEL:-}
      CERAMICS_AI_VISION: ${CERAMICS_AI_VISION:-true}
      TNVED_AI_API_KEY: ${TNVED_AI_API_KEY:-}
      TNVED_AI_BASE_URL: ${TNVED_AI_BASE_URL:-}
      TNVED_AI_MODEL: ${TNVED_AI_MODEL:-}
      TNVED_AI_VISION: ${TNVED_AI_VISION:-true}
      TNVED_AI_DAILY_LIMIT: ${TNVED_AI_DAILY_LIMIT:-100}
      TNVED_AI_NAMING_RULE: ${TNVED_AI_NAMING_RULE:-}
      TNVED_AI_PRICE_INPUT: ${TNVED_AI_PRICE_INPUT:-}
      TNVED_AI_PRICE_CACHED: ${TNVED_AI_PRICE_CACHED:-}
      TNVED_AI_PRICE_OUTPUT: ${TNVED_AI_PRICE_OUTPUT:-}
      TNVED_AI_VISION_MODEL: ${TNVED_AI_VISION_MODEL:-}
      TNVED_AI_VISION_API_KEY: ${TNVED_AI_VISION_API_KEY:-}
      TNVED_AI_VISION_BASE_URL: ${TNVED_AI_VISION_BASE_URL:-}
      TNVED_AI_VISION_PRICE_INPUT: ${TNVED_AI_VISION_PRICE_INPUT:-}
      TNVED_AI_VISION_PRICE_CACHED: ${TNVED_AI_VISION_PRICE_CACHED:-}
      TNVED_AI_VISION_PRICE_OUTPUT: ${TNVED_AI_VISION_PRICE_OUTPUT:-}
      TNVED_AI_EMBED_MODEL: ${TNVED_AI_EMBED_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TNVED_AI_EFFORT: ${TNVED_AI_EFFORT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres_data:
