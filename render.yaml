# Render Blueprint: бесплатный веб-сервис с API. Сайт — Vercel (frontend/vercel.json),
# база — Supabase. Пошаговая инструкция — deploy/README.md.
services:
  - type: web
    name: tradeflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase → Connect → Session pooler (порт 5432, пользователь postgres.<ref>)
      - key: DATABASE_URL
        sync: false
      # Первый сотрудник создаётся при запуске; пароль не короче 12 символов
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: GIN_MODE
        value: release
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: tradeflow_session
      - key: SESSION_TTL_HOURS
        value: "24"
      # Ключ DeepSeek для «Подобрать с ИИ» (без него цены подбираются только математикой)
      - key: DEEPSEEK_API_KEY
        sync: false
