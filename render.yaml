# Render Blueprint: бесплатный веб-сервис с API. Сайт — Vercel (frontend/vercel.json),
# база и файлы — Supabase. Пошаговая инструкция — deploy/README.md.
services:
  - type: web
    name: tradeflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase → Connect → Session pooler (порт 5432, пользователь postgres.<ref>)
      - key: DATABASE_URL
        sync: false
      # Supabase → Project Settings → Data API: Project URL (https://<ref>.supabase.co)
      - key: SUPABASE_URL
        sync: false
      # Supabase → Project Settings → API Keys → Secret key (sb_secret_...)
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Приватный бакет для XLSX и изображений; создаётся автоматически при запуске
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      # Первый сотрудник создаётся при запуске; пароль не короче 12 символов
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: GIN_MODE
        value: release
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: tradeflow_session
      - key: SESSION_TTL_HOURS
        value: "24"
      # Ключи AI (ANTHROPIC_API_KEY / GEMINI_API_KEY) для сметы не нужны — при необходимости
      # добавьте их потом в Render → Environment.
      - key: AI_PROVIDER
        value: anthropic
