name: import-calculator

# Development mode:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml watch
#
# The production compose file remains unchanged for normal image builds.
# This file only changes how the application code is run locally.
services:
  backend:
    build:
      context: ./backend
      target: dev
    working_dir: /src
    command: ["go", "run", "./cmd/server"]
    environment:
      GOCACHE: /tmp/go-build
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /src
          ignore:
            - .cache/
            - .gocache-*/
            - bin/
            - data/
            - go.mod
            - go.sum
            - Dockerfile
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/Dockerfile
